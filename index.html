```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="container text-center py-4">
        <h1>Carbon Footprint Calculator</h1>
        <p>Discover how your daily activities affect the environment.</p>
    </header>

    <main class="container">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body">
                <h2 class="h4 mb-4">Calculate Your Footprint</h2>

                <form id="carbonForm">
                    <div class="mb-3">
                        <label for="electricity" class="form-label">
                            Monthly electricity usage (kWh)
                        </label>
                        <input type="number" id="electricity"
                               class="form-control" min="0" required>
                    </div>

                    <div class="mb-3">
                        <label for="travel" class="form-label">
                            Monthly car travel (km)
                        </label>
                        <input type="number" id="travel"
                               class="form-control" min="0" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Calculate Footprint
                    </button>
                </form>

                <div id="result" class="mt-4 text-center"
                     aria-live="polite"></div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById("carbonForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const electricity = Number(document.getElementById("electricity").value);
            const travel = Number(document.getElementById("travel").value);

            const footprint = (electricity * 0.4) + (travel * 0.2);

            document.getElementById("result").textContent =
                "Illustrative estimate: " + footprint.toFixed(2) + " kg CO₂";
        });
    </script>

</body>
</html>
```
